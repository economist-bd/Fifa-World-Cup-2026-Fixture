<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ফিফা বিশ্বকাপ ২০২৬ ফিকশ্চার</title>
    
    <!-- PWA Manifest (ডাইনামিক জেনারেট করার জন্য লিংক) -->
    <link id="manifest" rel="manifest">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS লোড করা হচ্ছে -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- গুগল ফন্ট (বাংলা ফন্ট) -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* বেসিক সেটআপ এবং ফন্ট */
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #064e3b 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* মোবাইল ফ্রেম কনটেইনার */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* 3D এবং গ্লাসমরফিজম ডিজাইন */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        /* 3D হোভার এবং টাচ ইফেক্ট */
        .card-3d-wrap {
            perspective: 1000px;
            margin-bottom: 1rem;
        }
        
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card-3d.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #047857 0%, #0f172a 100%);
        }

        /* ট্যাব ট্রানজিশন অ্যানিমেশন */
        .tab-content {
            display: none;
            animation: slideIn3D 0.5s forwards;
            transform-origin: top center;
        }
        
        .tab-content.active {
            display: block;
        }

        @keyframes slideIn3D {
            0% {
                opacity: 0;
                transform: translateY(30px) rotateX(-15deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        /* ফুটবল ঘোরার অ্যানিমেশন */
        .spin-slow {
            animation: spin 6s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* বটম ন্যাভিগেশন বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            transition: all 0.3s ease;
        }
        .nav-item.active {
            color: #10b981;
            transform: translateY(-5px);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background-color: #10b981;
            border-radius: 50%;
        }

        /* কাস্টম স্ক্রলবার */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<div class="app-container flex flex-col">
    
    <!-- হেডার সেকশন -->
    <header class="pt-8 pb-6 px-6 glass-card rounded-none border-t-0 border-l-0 border-r-0 z-10 relative overflow-hidden">
        <div class="absolute -right-10 -top-10 opacity-20 text-9xl spin-slow">⚽</div>
        <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
            ফিফা বিশ্বকাপ ২০২৬
        </h1>
        <p class="text-sm text-gray-300 mt-1 flex items-center gap-2">
            <span>🏆</span> ফিকশ্চার (বাংলাদেশ সময়)
        </p>
    </header>

    <!-- মূল কনটেন্ট এরিয়া -->
    <main class="flex-1 overflow-y-auto px-4 pt-4 pb-24" id="main-content">
        
        <!-- ট্যাব ১: গ্রুপ পর্ব (ডিফল্ট) -->
        <section id="tab-groups" class="tab-content active">
            <h2 class="text-xl font-semibold mb-4 text-emerald-400 border-b border-emerald-500/30 pb-2">গ্রুপ পর্বের দলসমূহ</h2>
            <div id="groups-container" class="grid grid-cols-2 gap-3">
                <!-- গ্রুপ ডেটা জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
            </div>
        </section>

        <!-- ট্যাব ২: ম্যাচ ফিকশ্চার -->
        <section id="tab-matches" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-emerald-400">আসন্ন ম্যাচসমূহ</h2>
                <select id="stage-filter" class="bg-gray-800 text-sm rounded border border-gray-600 px-2 py-1 outline-none focus:border-emerald-400">
                    <option value="all">সব ম্যাচ</option>
                    <option value="group">গ্রুপ পর্ব</option>
                    <option value="knockout">নকআউট</option>
                </select>
            </div>
            <div id="matches-container">
                <!-- ম্যাচ ডেটা জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
            </div>
        </section>

        <!-- ট্যাব ৩: নকআউট ট্রি -->
        <section id="tab-knockout" class="tab-content">
            <h2 class="text-xl font-semibold mb-4 text-emerald-400 text-center">নকআউট পর্ব</h2>
            
            <div class="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-emerald-500 before:to-transparent">
                <!-- রাউন্ড অফ ৩২ -->
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full border border-white bg-emerald-500 text-slate-900 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                        ৩২
                    </div>
                    <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] glass-card p-4">
                        <h3 class="font-bold text-emerald-400 mb-1">টপ ৩২ রাউন্ড</h3>
                        <p class="text-xs text-gray-300">২৮ জুন - ২ জুলাই</p>
                    </div>
                </div>
                <!-- সুপার ১৬ -->
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full border border-white bg-emerald-500 text-slate-900 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                        ১৬
                    </div>
                    <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] glass-card p-4">
                        <h3 class="font-bold text-emerald-400 mb-1">সুপার ১৬</h3>
                        <p class="text-xs text-gray-300">৪ জুলাই - ৭ জুলাই</p>
                    </div>
                </div>
                <!-- কোয়ার্টার ফাইনাল -->
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full border border-white bg-emerald-500 text-slate-900 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10">
                        ০৮
                    </div>
                    <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] glass-card p-4">
                        <h3 class="font-bold text-emerald-400 mb-1">কোয়ার্টার ফাইনাল</h3>
                        <p class="text-xs text-gray-300">৯ জুলাই - ১১ জুলাই</p>
                    </div>
                </div>
                <!-- ফাইনাল -->
                <div class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
                    <div class="flex items-center justify-center w-12 h-12 rounded-full border-2 border-yellow-400 bg-yellow-500 text-slate-900 shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 z-10 text-xl">
                        🏆
                    </div>
                    <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] glass-card p-4 border-yellow-500/50">
                        <h3 class="font-bold text-yellow-400 mb-1">গ্র্যান্ড ফাইনাল</h3>
                        <p class="text-xs text-gray-300">১৯ জুলাই ২০২৬, রাত ১টা</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- বটম ন্যাভিগেশন -->
    <nav class="bottom-nav flex justify-around items-center py-3">
        <button class="nav-item active flex flex-col items-center gap-1 relative w-16" onclick="switchTab('groups', this)">
            <span class="text-2xl">📋</span>
            <span class="text-[10px] font-semibold">গ্রুপ</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 relative w-16" onclick="switchTab('matches', this)">
            <span class="text-2xl">🏟️</span>
            <span class="text-[10px] font-semibold">ম্যাচ</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1 relative w-16" onclick="switchTab('knockout', this)">
            <span class="text-2xl">🔥</span>
            <span class="text-[10px] font-semibold">নকআউট</span>
        </button>
    </nav>
</div>

<!-- ডেটা এবং লজিক স্ক্রিপ্ট -->
<script>
    // --- ডেটাসেট (আপনার ছবি অনুযায়ী আংশিক ডেটা, শিক্ষার্থীদের শেখার জন্য পর্যাপ্ত) ---
    
    // গ্রুপের ডেটা
    const groupsData = [
        { name: "গ্রুপ-এ", teams: [{n: "মেক্সিকো", f: "🇲🇽"}, {n: "দ. আফ্রিকা", f: "🇿🇦"}, {n: "দ. কোরিয়া", f: "🇰🇷"}, {n: "চেক প্রজাতন্ত্র", f: "🇨🇿"}] },
        { name: "গ্রুপ-বি", teams: [{n: "মার্. যুক্তরাষ্ট্র", f: "🇺🇸"}, {n: "মরক্কো", f: "🇲🇦"}, {n: "হাইতি", f: "🇭🇹"}, {n: "স্কটল্যান্ড", f: "🏴󠁧󠁢󠁳󠁣󠁴󠁿"}] },
        { name: "গ্রুপ-সি", teams: [{n: "ব্রাজিল", f: "🇧🇷"}, {n: "পানামা", f: "🇵🇦"}, {n: "আর্জেন্টিনা", f: "🇦🇷"}, {n: "জাপান", f: "🇯🇵"}] },
        { name: "গ্রুপ-ডি", teams: [{n: "জার্মানি", f: "🇩🇪"}, {n: "নেদারল্যান্ডস", f: "🇳🇱"}, {n: "সুইডেন", f: "🇸🇪"}, {n: "ফ্রান্স", f: "🇫🇷"}] },
        { name: "গ্রুপ-ই", teams: [{n: "স্পেন", f: "🇪🇸"}, {n: "বেলজিয়াম", f: "🇧🇪"}, {n: "পর্তুগাল", f: "🇵🇹"}, {n: "ইংল্যান্ড", f: "🏴󠁧󠁢󠁥󠁮󠁧󠁿"}] },
        { name: "গ্রুপ-এফ", teams: [{n: "ইতালি", f: "🇮🇹"}, {n: "উরুগুয়ে", f: "🇺🇾"}, {n: "সেনেগাল", f: "🇸🇳"}, {n: "ক্রোয়েশিয়া", f: "🇭🇷"}] }
    ];

    // ম্যাচের ডেটা
    const matchesData = [
        { date: "১১ জুন ২৬", time: "রাত ১টা", team1: "মেক্সিকো", flag1: "🇲🇽", team2: "দ. আফ্রিকা", flag2: "🇿🇦", stage: "group", stadium: "এস্তাদিও আজতেকা" },
        { date: "১১ জুন ২৬", time: "ভোর ৫টা", team1: "মার্. যুক্তরাষ্ট্র", flag1: "🇺🇸", team2: "মরক্কো", flag2: "🇲🇦", stage: "group", stadium: "মেটলাইফ স্টেডিয়াম" },
        { date: "১২ জুন ২৬", time: "রাত ২টা", team1: "ব্রাজিল", flag1: "🇧🇷", team2: "পানামা", flag2: "🇵🇦", stage: "group", stadium: "সোফাই স্টেডিয়াম" },
        { date: "১২ জুন ২৬", time: "সকাল ৬টা", team1: "আর্জেন্টিনা", flag1: "🇦🇷", team2: "জাপান", flag2: "🇯🇵", stage: "group", stadium: "বিএমও ফিল্ড" },
        { date: "১৩ জুন ২৬", time: "রাত ৩টা", team1: "জার্মানি", flag1: "🇩🇪", team2: "নেদারল্যান্ডস", flag2: "🇳🇱", stage: "group", stadium: "মার্সিডিজ-বেঞ্জ" },
        { date: "২৮ জুন ২৬", time: "রাত ২টা", team1: "গ্রুপ এ চ্যাম্পিয়ন", flag1: "❓", team2: "গ্রুপ বি রানার্সআপ", flag2: "❓", stage: "knockout", stadium: "নকআউট - টপ ৩২" },
        { date: "০৪ জুলাই ২৬", time: "রাত ১টা", team1: "ম্যাচ ৭৩ জয়ী", flag1: "🔥", team2: "ম্যাচ ৭৪ জয়ী", flag2: "🔥", stage: "knockout", stadium: "সুপার ১৬" }
    ];

    // --- ইউআই রেন্ডারিং ফাংশন ---

    // গ্রুপ রেন্ডার করা
    function renderGroups() {
        const container = document.getElementById('groups-container');
        let html = '';
        groupsData.forEach((group, index) => {
            let delay = index * 0.1;
            html += `
                <div class="glass-card p-3" style="animation: slideIn3D 0.5s ${delay}s forwards; opacity:0;">
                    <h3 class="font-bold text-center text-sm mb-2 text-cyan-300 border-b border-cyan-800 pb-1">${group.name}</h3>
                    <ul class="text-xs space-y-2">
                        ${group.teams.map(t => `<li class="flex items-center gap-2"><span class="text-lg">${t.f}</span> ${t.n}</li>`).join('')}
                    </ul>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ম্যাচ রেন্ডার করা (3D কার্ড ফ্লিপ ইফেক্ট সহ)
    function renderMatches(filter = 'all') {
        const container = document.getElementById('matches-container');
        container.innerHTML = ''; // ক্লিয়ার
        
        const filteredMatches = filter === 'all' ? matchesData : matchesData.filter(m => m.stage === filter);
        
        filteredMatches.forEach((match, index) => {
            const cardWrap = document.createElement('div');
            cardWrap.className = 'card-3d-wrap';
            cardWrap.style.animation = `slideIn3D 0.5s ${index * 0.1}s forwards`;
            cardWrap.style.opacity = '0';
            
            cardWrap.innerHTML = `
                <div class="card-3d relative w-full h-28 cursor-pointer" onclick="this.classList.toggle('flipped')">
                    <!-- কার্ডের সামনের দিক -->
                    <div class="card-front glass-card absolute w-full h-full p-3 flex flex-col justify-between">
                        <div class="flex justify-between items-center text-xs text-gray-400">
                            <span>📅 ${match.date}</span>
                            <span class="text-emerald-400 font-bold">${match.time}</span>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <div class="text-center w-5/12">
                                <div class="text-2xl">${match.flag1}</div>
                                <div class="font-semibold text-sm truncate">${match.team1}</div>
                            </div>
                            <div class="text-sm font-bold bg-gray-800 px-2 py-1 rounded-full">VS</div>
                            <div class="text-center w-5/12">
                                <div class="text-2xl">${match.flag2}</div>
                                <div class="font-semibold text-sm truncate">${match.team2}</div>
                            </div>
                        </div>
                    </div>
                    <!-- কার্ডের পেছনের দিক (ফ্লিপ করলে দেখাবে) -->
                    <div class="card-back glass-card rounded-xl text-center p-4">
                        <h4 class="text-emerald-400 font-bold mb-2">ভেন্যু বিস্তারিত</h4>
                        <p class="text-sm">🏟️ ${match.stadium}</p>
                        <p class="text-xs text-gray-300 mt-2">ম্যাচের স্টেজ: ${match.stage === 'group' ? 'গ্রুপ পর্ব' : 'নকআউট'}</p>
                        <p class="text-[10px] text-gray-400 mt-1">(বিস্তারিত দেখতে আবার ট্যাপ করুন)</p>
                    </div>
                </div>
            `;
            container.appendChild(cardWrap);
        });
    }

    // --- ইভেন্ট লিসেনার এবং লজিক ---

    // ট্যাব পরিবর্তন করার লজিক
    window.switchTab = function(tabId, btnElement) {
        // সব ট্যাব কন্টেন্ট লুকানো
        document.querySelectorAll('.tab-content').forEach(el => {
            el.classList.remove('active');
            // অ্যানিমেশন রিসেট করার জন্য হ্যাক
            el.style.animation = 'none';
            el.offsetHeight; /* trigger reflow */
            el.style.animation = null; 
        });
        
        // সব বাটন থেকে active ক্লাস রিমুভ
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        // সিলেক্টেড ট্যাব দেখানো
        document.getElementById(`tab-${tabId}`).classList.add('active');
        btnElement.classList.add('active');

        // ফিল্টার রিসেট
        if(tabId === 'matches') {
            document.getElementById('stage-filter').value = 'all';
            renderMatches();
        }
    };

    // ম্যাচ ফিল্টার চেঞ্জ ইভেন্ট
    document.getElementById('stage-filter').addEventListener('change', (e) => {
        renderMatches(e.target.value);
    });

    // ইনিশিয়াল লোড
    window.onload = () => {
        renderGroups();
        renderMatches();
        setupPWA();
    };

    // --- PWA (Progressive Web App) সেটআপ (Single File Workaround) ---
    function setupPWA() {
        try {
            // ম্যানিফেস্ট তৈরি করা
            const manifestJSON = {
                "name": "FIFA 2026 Fixture BD",
                "short_name": "FIFA 26",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#0f172a",
                "theme_color": "#10b981",
                "icons": [
                    {
                        "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚽%3C/text%3E%3C/svg%3E",
                        "sizes": "192x192",
                        "type": "image/svg+xml"
                    }
                ]
            };
            const stringManifest = JSON.stringify(manifestJSON);
            const blob = new Blob([stringManifest], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            document.getElementById('manifest').setAttribute('href', manifestURL);

            // সার্ভিস ওয়ার্কার রেজিস্টার (অফলাইন সাপোর্টের জন্য বেসিক)
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline Mode Active')));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl).then(() => {
                    console.log('PWA Service Worker Registered (Mock)');
                });
            }
        } catch (error) {
            console.log("PWA setup restricted in this environment, but layout works fine.");
        }
    }
</script>
